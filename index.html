<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini RH PRO v2.4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#f0f2f5;
  padding:10px;
  margin:0;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#fff;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h2{
  text-align:center;
}

h3{
  margin-top:0;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #bbb;
  box-sizing:border-box;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
  margin-top:5px;
}

.btn-save{
  background:#28a745;
}

.btn-delete{
  background:#dc3545;
}

.btn-view{
  background:#007bff;
}

.btn-pdf{
  background:#6f42c1;
}

.btn-lock{
  background:#343a40;
}

.btn-export{
  background:#5ac85a;
}

.btn-compra{
  background:#ff9800;
}

.btn-pagamento{
  background:#00bcd4;
}

.box{
  padding:8px;
  margin:5px 0;
  border-radius:6px;
}

.trabalho{
  background:#e6ffe6;
  border-left:4px solid green;
}

.falta{
  background:#ffe6e6;
  border-left:4px solid red;
}

.folga{
  background:#e6f0ff;
  border-left:4px solid blue;
}

.compra{
  background:#fff3cd;
  border-left:4px solid #ff9800;
}

.pagamento{
  background:#d4edda;
  border-left:4px solid #28a745;
}

#periodoAtual{
  text-align:center;
  padding:10px;
  background:#eef7ff;
  border-radius:8px;
  font-weight:bold;
}

#saldoCliente{
  font-size:20px;
  font-weight:bold;
  text-align:center;
  padding:12px;
  border-radius:8px;
  background:#eef7ff;
}

#statusAtualizacao{
  color:#666;
  font-size:13px;
  margin-top:6px;
}

</style>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ff0000">

<script>

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker.register(
'service-worker.js'
);

});

}

</script>

</head>

<body>

<div class="container">

<h2>MINI RH PRO v2.4</h2>

<div class="card">

<b>Versão:</b>
2.4

<button
class="btn-export"
onclick="forcarAtualizacao()">

🔄 Atualizar Aplicativo

</button>

<div id="statusAtualizacao">
Sistema pronto.
</div>

</div>

<!-- RH -->

<div class="card">

<h3>Cadastro Funcionário</h3>

<input
id="nome"
placeholder="Nome">

<input
type="date"
id="inicio">

<input
id="folga"
type="number"
placeholder="Folga: 0=Seg ... 6=Dom">

<input
id="salario"
type="number"
placeholder="Salário mensal">

<input
id="carga"
type="number"
placeholder="Carga diária (horas)">

<button
class="btn-save"
onclick="salvarFunc()">

Salvar Funcionário

</button>

</div>

<div class="card">

<h3>Funcionário</h3>

<select id="lista"></select>

<button
class="btn-delete"
onclick="excluirFunc()">

Excluir

</button>

<button
class="btn-view"
onclick="quinzenaAnterior()">

◀ Período Anterior

</button>

<button
class="btn-save"
onclick="quinzenaAtual()">

Período Atual

</button>

<button
class="btn-view"
onclick="quinzenaProxima()">

Próximo Período ▶

</button>

<div id="periodoAtual">
Carregando...
</div>

<button
class="btn-view"
onclick="mostrar()">

Ver

</button>

<button
class="btn-lock"
onclick="travar()">

Travar Período

</button>

<button
class="btn-pdf"
onclick="gerarPDF()">

Gerar PDF

</button>

<button
class="btn-export"
onclick="exportar()">

Exportar JSON

</button>

<input
type="file"
onchange="importar(event)">

</div>

<div class="card">

<h3>Registro do Dia</h3>

<label>📅 Data</label>
<input type="date" id="data">

<label>🟢 Entrada</label>
<input type="time" id="entrada">

<label>🔴 Saída</label>
<input type="time" id="saida">

<label>☕ Intervalo saída</label>
<input type="time" id="is">

<label>☕ Intervalo volta</label>
<input type="time" id="iv">

<button
class="btn-save"
onclick="registrar()">

Salvar / Atualizar

</button>

</div>

<!-- CLIENTES -->

<div class="card">

<h3>👤 Cadastro de Cliente</h3>

<input
id="clienteNome"
placeholder="Nome do cliente">

<input
id="clienteTelefone"
placeholder="Telefone">

<input
id="clienteEndereco"
placeholder="Endereço">

<textarea
id="clienteObs"
placeholder="Observações"></textarea>

<button
class="btn-save"
onclick="salvarCliente()">

Salvar Cliente

</button>

</div>

<div class="card">

<h3>📋 Clientes</h3>

<select id="listaClientes"></select>

<button
class="btn-delete"
onclick="excluirCliente()">

Excluir Cliente

</button>

<div id="saldoCliente">

Saldo:
R$ 0,00

</div>

<button
style="
background:#ff9800;
width:100%;
padding:10px;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
margin-top:5px;
"
onclick="adicionarCompra()">

➕ Nova Compra

</button>

<button
style="
background:#28a745;
width:100%;
padding:10px;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
margin-top:5px;
"
onclick="registrarPagamento()">

💰 Receber Pagamento

</button>

<button
class="btn-pdf"
onclick="gerarPDFCliente()">

📄 PDF Cliente

</button>

<div
id="extratoCliente"
class="card"
style="margin-top:10px;">
</div>

</div>

<div id="hist"></div>

<div id="total" class="card"></div>

<div id="extratoCliente" class="card"></div>

<script>

let periodoOffset = 0;

function min(t){

 if(!t) return 0;

 let p=t.split(':');

 return (
  parseInt(p[0])*60
 )+
 parseInt(p[1]);
}

function dinheiro(v){

 return Number(v||0)
 .toLocaleString(
  'pt-BR',
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );

}

/* ==========================
   FUNCIONÁRIOS
========================== */

function salvarFunc(){

 let l=JSON.parse(
  localStorage.getItem('f')||'[]'
 );

 if(
  !nome.value ||
  !salario.value ||
  !carga.value
 ){
  return alert(
   "Preencha nome, salário e carga!"
  );
 }

 l.push({

  nome:nome.value,
  inicio:inicio.value,
  folga:parseInt(folga.value||0),
  salario:parseFloat(salario.value||0),
  carga:parseFloat(carga.value||0)

 });

 localStorage.setItem(
  'f',
  JSON.stringify(l)
 );

 carregar();

 alert("Funcionário salvo!");
}

function excluirFunc(){

 if(
  !confirm(
   "Excluir funcionário?"
  )
 ) return;

 let l=JSON.parse(
  localStorage.getItem('f')||'[]'
 );

 l.splice(
  lista.value,
  1
 );

 localStorage.setItem(
  'f',
  JSON.stringify(l)
 );

 carregar();
}

function carregar(){

 let l=JSON.parse(
  localStorage.getItem('f')||'[]'
 );

 lista.innerHTML="";

 l.forEach((f,i)=>{

  lista.innerHTML+=`

  <option value="${i}">
  ${f.nome}
  </option>

  `;

 });
}

function obterPeriodo(){

 let hoje=new Date();

 let dataBase=new Date(
  hoje.getFullYear(),
  hoje.getMonth()+periodoOffset,
  hoje.getDate()
 );

 let inicio;
 let fim;

 if(dataBase.getDate()<=15){

  inicio=new Date(
   dataBase.getFullYear(),
   dataBase.getMonth(),
   1
  );

  fim=new Date(
   dataBase.getFullYear(),
   dataBase.getMonth(),
   15
  );

 }else{

  inicio=new Date(
   dataBase.getFullYear(),
   dataBase.getMonth(),
   16
  );

  fim=new Date(
   dataBase.getFullYear(),
   dataBase.getMonth()+1,
   0
  );

 }

 periodoAtual.innerHTML=

 inicio.toLocaleDateString("pt-BR")

 +

 " até "

 +

 fim.toLocaleDateString("pt-BR");

 return {

  inicio,
  fim

 };

}

function quinzenaAnterior(){

 periodoOffset--;

 obterPeriodo();

}

function quinzenaProxima(){

 periodoOffset++;

 obterPeriodo();

}

function quinzenaAtual(){

 periodoOffset=0;

 obterPeriodo();

}

function registrar(){

 if(!data.value){

  return alert(
   "Informe a data"
  );

 }

 let funcs=JSON.parse(
  localStorage.getItem('f')||'[]'
 );

 let f=funcs[lista.value];

 if(!f){

  return alert(
   "Selecione um funcionário"
  );

 }

 let e=min(entrada.value);
 let s=min(saida.value);

 let i1=min(is.value);
 let i2=min(iv.value);

 let total=s-e;

 if(i1 && i2){

  total-=(i2-i1);

 }

 let horas=total/60;

 if(
  horas<0 ||
  !isFinite(horas)
 ){

  horas=0;

 }

 let diff=
 horas-f.carga;

 let reg=JSON.parse(
  localStorage.getItem('reg')||'[]'
 );

 reg=reg.filter(r=>

 !(

  r.func==lista.value &&
  r.data==data.value

 )

 );

 reg.push({

  func:lista.value,
  data:data.value,

  entrada:entrada.value,
  saida:saida.value,

  is:is.value,
  iv:iv.value,

  horas,
  diff

 });

 localStorage.setItem(
  'reg',
  JSON.stringify(reg)
 );

 alert(
  "Registro salvo!"
 );

}

/* ==========================
   CLIENTES
========================== */

function salvarCliente(){

 let clientes=JSON.parse(
  localStorage.getItem('clientes')||'[]'
 );

 if(!clienteNome.value){

  return alert(
   "Informe o nome do cliente"
  );
 }

 clientes.push({

  nome:clienteNome.value,
  telefone:clienteTelefone.value,
  endereco:clienteEndereco.value,
  obs:clienteObs.value

 });

 localStorage.setItem(
  'clientes',
  JSON.stringify(clientes)
 );

 carregarClientes();

 clienteNome.value="";
 clienteTelefone.value="";
 clienteEndereco.value="";
 clienteObs.value="";

 alert("Cliente salvo!");

}

function carregarClientes(){

 let clientes=JSON.parse(
  localStorage.getItem('clientes')||'[]'
 );

 listaClientes.innerHTML="";

 clientes.forEach((c,i)=>{

  listaClientes.innerHTML+=`

  <option value="${i}">
  ${c.nome}
  </option>

  `;

 });

 atualizarSaldoCliente();

}

function excluirCliente(){

 if(
  !confirm(
   "Excluir cliente?"
  )
 ) return;

 let clientes=JSON.parse(
  localStorage.getItem('clientes')||'[]'
 );

 clientes.splice(
  listaClientes.value,
  1
 );

 localStorage.setItem(
  'clientes',
  JSON.stringify(clientes)
 );

 carregarClientes();

}

function obterMovimentos(){

 return JSON.parse(
  localStorage.getItem('movimentos')||'[]'
 );

}

function salvarMovimentos(lista){

 localStorage.setItem(

  'movimentos',

  JSON.stringify(lista)

 );

}

function atualizarSaldoCliente(){

 let movs=
 obterMovimentos();

 let cliente=
 listaClientes.value;

 let saldo=0;

 movs.forEach(m=>{

  if(m.cliente==cliente){

   if(m.tipo=="compra"){

    saldo+=Number(m.valor);

   }

   if(m.tipo=="pagamento"){

    saldo-=Number(m.valor);

   }

  }

 });

 saldoCliente.innerHTML=
 `
 Saldo:
 R$ ${dinheiro(saldo)}
 `;

}

/* ==========================
   COMPRAS E PAGAMENTOS
========================== */

function adicionarCompra(){

 let descricao=
 prompt("Descrição da compra:");

 if(!descricao) return;

 let valor=
 parseFloat(
  prompt("Valor da compra:")
 );

 if(
  !valor ||
  valor<=0
 ) return;

 let movs=
 obterMovimentos();

 movs.push({

  cliente:
  listaClientes.value,

  tipo:"compra",

  descricao,

  valor,

  data:
  new Date()
  .toISOString()
  .split('T')[0]

 });

 salvarMovimentos(
  movs
 );

 atualizarSaldoCliente();

 mostrarExtratoCliente();

 alert(
  "Compra registrada!"
 );

}

function registrarPagamento(){

 let valor=
 parseFloat(
  prompt(
   "Valor recebido:"
  )
 );

 if(
  !valor ||
  valor<=0
 ) return;

 let movs=
 obterMovimentos();

 movs.push({

  cliente:
  listaClientes.value,

  tipo:"pagamento",

  descricao:"Pagamento",

  valor,

  data:
  new Date()
  .toISOString()
  .split('T')[0]

 });

 salvarMovimentos(
  movs
 );

 atualizarSaldoCliente();

 mostrarExtratoCliente();

 alert(
  "Pagamento registrado!"
 );

}

function mostrarExtratoCliente(){

 let movs=
 obterMovimentos();

 let cliente=
 listaClientes.value;

 let html=
 `
 <h3>
 📄 Extrato Cliente
 </h3>
 `;

 let saldo=0;

 movs.forEach(m=>{

  if(m.cliente!=cliente)
   return;

  if(
   m.tipo=="compra"
  ){

   saldo+=
   Number(m.valor);

   html+=`

   <div class="box compra">

   <b>
   ${m.data}
   </b><br>

   ${m.descricao}<br>

   + R$
   ${dinheiro(m.valor)}

   </div>

   `;

  }

  if(
   m.tipo=="pagamento"
  ){

   saldo-=
   Number(m.valor);

   html+=`

   <div class="box pagamento">

   <b>
   ${m.data}
   </b><br>

   Pagamento<br>

   - R$
   ${dinheiro(m.valor)}

   </div>

   `;

  }

 });

 html+=`

 <div
 style="
 margin-top:10px;
 font-size:20px;
 font-weight:bold;
 ">

 Saldo Atual:
 R$ ${dinheiro(saldo)}

 </div>

 `;

 extratoCliente.innerHTML=
 html;

}

/* ==========================
   PDF CLIENTE
========================== */

function gerarPDFCliente(){

 const { jsPDF } =
 window.jspdf;

 let doc=
 new jsPDF();

 let clientes=
 JSON.parse(
  localStorage.getItem(
   'clientes'
  )||'[]'
 );

 let cliente=
 clientes[
  listaClientes.value
 ];

 if(!cliente){

  return alert(
   "Selecione um cliente"
  );

 }

 let movs=
 obterMovimentos();

 let y=20;

 let saldo=0;

 doc.setFontSize(16);

 doc.text(
  "EXTRATO CLIENTE",
  10,
  10
 );

 doc.setFontSize(12);

 doc.text(
  cliente.nome,
  10,
  y
 );

 y+=10;

 movs.forEach(m=>{

  if(
   m.cliente!=
   listaClientes.value
  ) return;

  let texto="";

  if(
   m.tipo=="compra"
  ){

   saldo+=
   Number(m.valor);

   texto=
   `${m.data} | ${m.descricao} | +R$ ${dinheiro(m.valor)}`;

  }else{

   saldo-=
   Number(m.valor);

   texto=
   `${m.data} | Pagamento | -R$ ${dinheiro(m.valor)}`;

  }

  doc.text(
   texto,
   10,
   y
  );

  y+=6;

  if(y>270){

   doc.addPage();

   y=20;

  }

 });

 y+=10;

 doc.text(
  `Saldo Atual: R$ ${dinheiro(saldo)}`,
  10,
  y
 );

 y+=20;

 doc.line(
  10,
  y,
  100,
  y
 );

 doc.text(
  "Assinatura",
  10,
  y+5
 );

 doc.save(
  "cliente.pdf"
 );

}

/* ==========================
   BACKUP
========================== */

function exportar(){

 let dados={

  f:JSON.parse(
   localStorage.getItem('f')||'[]'
  ),

  reg:JSON.parse(
   localStorage.getItem('reg')||'[]'
  ),

  clientes:JSON.parse(
   localStorage.getItem('clientes')||'[]'
  ),

  movimentos:JSON.parse(
   localStorage.getItem('movimentos')||'[]'
  )

 };

 let blob=
 new Blob(

  [
   JSON.stringify(
    dados
   )
  ],

  {
   type:
   "application/json"
  }

 );

 let a=
 document.createElement(
  'a'
 );

 a.href=
 URL.createObjectURL(
  blob
 );

 a.download=
 "backup.json";

 a.click();

}

function importar(e){

 let file=
 e.target.files[0];

 let reader=
 new FileReader();

 reader.onload=
 function(evt){

  let dados=
  JSON.parse(
   evt.target.result
  );

  localStorage.setItem(
   'f',
   JSON.stringify(
    dados.f||[]
   )
  );

  localStorage.setItem(
   'reg',
   JSON.stringify(
    dados.reg||[]
   )
  );

  localStorage.setItem(
   'clientes',
   JSON.stringify(
    dados.clientes||[]
   )
  );

  localStorage.setItem(
   'movimentos',
   JSON.stringify(
    dados.movimentos||[]
   )
  );

  carregar();

  carregarClientes();

  alert(
   "Backup restaurado!"
  );

 };

 reader.readAsText(file);

}

/* ==========================
   UTILITÁRIOS
========================== */

function travar(){

 alert(
  "Período travado!"
 );

}

function forcarAtualizacao(){

 alert(
  "Atualização manual disponível na próxima versão."
 );

}

/* ==========================
   INICIALIZAÇÃO
========================== */

carregar();

carregarClientes();

quinzenaAtual();

if(listaClientes){

 listaClientes.addEventListener(
  "change",
  ()=>{

   atualizarSaldoCliente();

   mostrarExtratoCliente();

  }
 );

}

</script>

</body>
</html>
